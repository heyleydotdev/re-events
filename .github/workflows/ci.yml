name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyze
      - run: composer test

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wp: ['6.5', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y subversion
      - run: composer install --no-interaction --prefer-dist
      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }} true
      - run: composer test:integration

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:coverage

  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:js
      - run: bun run build
      - run: bun run docs:build
      - run: git diff --exit-code docs/api/auth.html

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run wp-env start
      - name: Seed custom form event
        run: |
          bun run wp-env run cli wp eval '$e=ReEvents\CLI\Test_Factory::event(["title"=>"E2E custom form","meta"=>["_reevents_start_utc"=>gmdate("Y-m-d H:i:s"),"_reevents_end_utc"=>gmdate("Y-m-d H:i:s",time()+3600),"_reevents_timezone"=>"UTC"]]); $t=ReEvents\CLI\Test_Factory::ticket($e,["capacity"=>5,"price_minor"=>0]); echo json_encode(["event"=>$e,"ticket"=>$t]);' | sed -n '/^{/p' > /tmp/e2e.json
          echo "REEVENTS_EVENT_ID=$(jq -r .event /tmp/e2e.json)" >> "$GITHUB_ENV"
          echo "REEVENTS_TICKET_ID=$(jq -r .ticket /tmp/e2e.json)" >> "$GITHUB_ENV"
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: composer install --no-interaction --prefer-dist
      - run: bun install --frozen-lockfile
      - run: bun run wp-env start
      - name: Generate spec
        run: |
          bun run wp-env run cli wp re-events openapi > /tmp/openapi.out
          sed -n '/^{/,$p' /tmp/openapi.out > /tmp/openapi.json
      - name: Validate spec
        run: |
          php -r 'json_decode( file_get_contents( "/tmp/openapi.json" ), true, 512, JSON_THROW_ON_ERROR );'
          bunx redocly lint /tmp/openapi.json
      - name: Check spec is current
        run: diff -u docs/api/openapi.json /tmp/openapi.json
      - name: Check shortcode docs are current
        run: |
          bun run wp-env run cli wp re-events shortcode-docs | sed -n '/^# ReEvents shortcodes/,$p' > /tmp/shortcodes.md
          diff -u docs/shortcodes/README.md /tmp/shortcodes.md
      - name: Run self-test
        run: bun run wp-env run cli wp re-events self-test
      - name: Run booking concurrency test
        run: bun run wp-env run cli wp re-events concurrency-test --capacity=5 --requests=10
      - name: Seed benchmark fixtures
        run: bun run wp-env run cli wp re-events bench seed --events=500 --occurrences=5000 --bookings=200 --venues=20
      - name: Run benchmark
        run: bun run wp-env run cli wp re-events bench run --iterations=3 --assert
      - name: Clean benchmark fixtures
        if: always()
        run: bun run wp-env run cli wp re-events bench clean
